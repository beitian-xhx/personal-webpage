{{- $catsData := transform.Unmarshal (os.ReadFile "data/taxonomies/categories.yaml") -}}
{{- $tagsData := transform.Unmarshal (os.ReadFile "data/taxonomies/tags.yaml") -}}
{{- $catsList := slice -}}
{{- if reflect.IsMap $catsData -}}{{- $catsList = $catsData.categories -}}{{- else -}}{{- $catsList = $catsData -}}{{- end -}}
{{- $catsOpts := slice -}}
{{- range $catsList -}}{{- $catsOpts = $catsOpts | append (index . "name") -}}{{- end -}}
{{- $tagsList := slice -}}
{{- if reflect.IsMap $tagsData -}}{{- $tagsList = $tagsData.tags -}}{{- else -}}{{- $tagsList = $tagsData -}}{{- end -}}
{{- $tagsOpts := slice -}}
{{- range $tagsList -}}{{- $tagsOpts = $tagsOpts | append (index . "name") -}}{{- end -}}
{{- $catsJSON := $catsOpts | jsonify -}}
{{- $tagsJSON := $tagsOpts | jsonify -}}
{{- $base := os.ReadFile "assets/admin/cms-config-base.yml" -}}
{{ strings.Replace (strings.Replace $base "__CATEGORY_OPTIONS__" $catsJSON) "__TAG_OPTIONS__" $tagsJSON }}
asset_collections:
{{- range os.ReadDir "static/img" }}
  {{- if .IsDir }}
  - name: {{ printf "img_%s" (replaceRE "[^a-z0-9_]" "_" (lower .Name)) }}
    label: {{ .Name | jsonify }}
    media_folder: /static/img/{{ .Name }}
    public_folder: /img/{{ .Name }}
  {{- end }}
{{- end }}